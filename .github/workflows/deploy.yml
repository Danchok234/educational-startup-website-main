name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/app/landing/educational-startup-website-main
            git pull origin master
            docker build -t educational-startup-website:latest .
            docker rm -f educational-startup-website || true
            docker run -d \
              --name educational-startup-website \
              --restart always \
              -p 8080:8080 \
              educational-startup-website:latest

